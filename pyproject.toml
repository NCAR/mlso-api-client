[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mlso-api-client"
version = "1.1.3"
description = "Python package providing a client to access Mauna Loa Solar Observatory (MLSO) data"
authors = [
  { name = "Michael Galloy" },
  { name = "Michael Galloy", email = "mgalloy@ucar.edu" },
]
maintainers = [
  { name = "Michael Galloy" },
  { name = "Michael Galloy", email = "mgalloy@ucar.edu" },
]
license = "MIT"
#license = {text = "MIT"}
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
# see classifiers at https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Programming Language :: Python",
]
keywords = ["webservice", "Mauna Loa Solar Observatory", "MLSO", "solar"]
dependencies = [
  "requests",
  "rich"
]

[project.urls]
homepage = "https://www2.hao.ucar.edu/mlso"
repository = "https://github.com/NCAR/mlso-api-client"
documentation = "https://mlso-api-client.readthedocs.io/en/latest/"
issues = "https://github.com/NCAR/mlso-api-client/issues"
changelog = "https://github.com/NCAR/mlso-api-client/blob/master/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
dev = [
  "mlso-api-client[test]",
  "build",
  "pre-commit",
  "tox",
  "wheel",
  "watchdog",
  "Sphinx",
  "twine",
  "coverage",
  "flake8",
  "pytest-runner",
  "black",
  "sphinx_rtd_theme",
  "myst-parser",
]

[project.scripts]
mlsoapi = "mlso.api:client.main"

[tool.setuptools.package-data]
"mlso.api" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py314", "py313", "py312"]
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.pytest.ini_options]
# increment the --cov-fail-under as we increase test coverage
addopts = "--cov-report html:coverage_html --cov-report term-missing --cov-fail-under 80"

[tool.tox]
requires = ["tox>=4.19"]
env_list = ["3.14", "3.13", "3.12", "type"]

[tool.tox.env_run_base]
description = "Run test under {base_python}"
extras = ["test"]
commands = [["pytest", "--local", "tests"]]

[tool.tox.env.type]
description = "run type check on code base"
deps = ["mypy==1.18.2", "types-cachetools>=5.5.0.20240820", "types-chardet>=5.0.4.6"]
commands = [["mypy", "src{/}mlso"], ["mypy", "--local", "tests"]]
